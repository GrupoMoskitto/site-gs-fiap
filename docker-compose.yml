version: '3.8'

services:
  web:
    build: .
    container_name: gs-fiap-monitor
    ports:
      - "8000:8000"
    environment:
      - DEBUG=False
      - SECRET_KEY=your-secret-key-change-in-production
      - ALLOWED_HOSTS=localhost,127.0.0.1
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
    command: python gs_fiap_monitor/manage.py runserver 0.0.0.0:8000

volumes:
  static_volume:
